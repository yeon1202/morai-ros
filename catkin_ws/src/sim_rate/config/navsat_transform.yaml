# navsat_transform_node 설정
# 위경도(sensor_msgs/NavSatFix) -> 정확한 UTM(GeographicLib, 타원체 반영) 기반
# 로컬좌표(/odometry/gps)로 변환. 우리가 손으로 짠 구면근사+유사변환 보정을
# 완전히 대체함 - 회전/축척 오차가 애초에 안 생기는 정공법.

frequency: 30
delay: 0.0
magnetic_declination_radians: 0.0   # MORAI 시뮬레이터엔 자기편차 개념 없음
yaw_offset: 0.023516
# !!! 2026-08-06 재검증 중 !!! 처음엔 navsat vs GT 오차(6.35m)를 자오선 수렴각
# 회전 문제로 보고 yaw_offset=0.023516을 넣어서 2.70m로 줄였는데, 그 뒤 다시
# 계산해보니 "추가로 더 필요한 회전"이 -0.038도밖에 안 나와서 회전 자체가
# 원인이 아니었을 가능성이 큼(그 정도론 오차가 거의 안 줄어듦, 시뮬레이션 확인).
# 대신 속력이 빠를수록 오차가 커지는 패턴(타이밍 지연) 발견 -> 검증 스크립트
# (gps_direct_utm_check.py) 자체의 비교 타이밍 버그였을 가능성이 높음. 스크립트
# 고친 뒤 yaw_offset=0(원래 상태)부터 다시 정확히 재보는 중 - 이게 필요없는
# 보정이었으면 다시 0으로 확정, 그래도 필요하면 이 값을 재조정.
zero_altitude: true                 # 2D 주행이라 고도는 0으로 고정
broadcast_cartesian_transform: false   # [로컬 수정] broadcast_utm_transform 은 deprecated      # tf 트리 안 씀
publish_filtered_gps: false
use_odometry_yaw: false             # 시작시 IMU의 yaw를 그대로 기준방향으로 사용

# !!! 2026-08-06 재시도 !!! 예전(2026-08-04)에 wait_for_datum:true+datum 고정원점이
# "계속 (0,0,0)에 멈춰있는" 것처럼 보여서 auto(첫 GPS fix)로 되돌렸었는데, 그 시점엔
# world_frame=map 버그(ekf.yaml 참고)가 같이 섞여있어서 원인이 datum 쪽인지 그
# 버그 쪽인지 명확히 구분이 안 됐었음. 그 버그를 고친 뒤 다시 보니, auto 모드는
# "노드 켤 때 GPS로 잡히는 아무 지점"을 원점으로 삼아서, 매번 다르게 스폰되면
# 대회 공식 원점(eastOffset 302595.0, northOffset 4124145.0)이랑 최대 수백m씩
# 어긋나는 진짜 문제가 실측으로 확인됨(454.6m 차이 실측). 대회 공식 원점으로
# 다시 고정 시도 - 이번엔 world_frame 버그가 없는 상태라 다른 결과가 나올 수 있음.
# 안 되면 auto로 되돌리고, 대신 기록/실주행을 항상 대회 출발선에서 시작하는 걸로
# 원점 일치를 보장해야 함.
wait_for_datum: true
datum: [37.24294888, 126.77441945, 0.0]
