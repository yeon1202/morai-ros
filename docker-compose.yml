# ROS1 Noetic 2-컨테이너 구성 (host 네트워크 + 공용 roscore)
#   sim : MORAI Linux 빌드(Unity 앱) + MORAI ROS 브리지 실행 (GPU+GUI)
#   dev : 본인 알고리즘 개발 (RViz 등)
# 두 컨테이너 모두 host 네트워크라 ROS_MASTER_URI=localhost 로 서로 통신.

x-common: &common
  build:
    context: .
    args:
      UID: "1000"
      GID: "1000"
  image: morai-noetic:latest
  network_mode: host          # host 네트워크 → ROS 포트/roscore 공유가 가장 단순
  ipc: host                   # RViz/Unity 공유메모리 성능
  environment:
    DISPLAY: "${DISPLAY:-:1}"
    QT_X11_NO_MITSHM: "1"
    ROS_MASTER_URI: "http://localhost:11311"
    ROS_HOSTNAME: "localhost"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  stdin_open: true            # -i
  tty: true                   # -t  (docker compose up -d 후 exec 로 붙어서 작업)

services:
  sim:
    <<: *common
    container_name: morai-sim
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./catkin_ws:/home/dev/catkin_ws     # 워크스페이스 공유
      - ./morai_sim:/home/dev/morai_sim     # 여기에 MORAI Linux 빌드 폴더를 넣으세요
      - morai_sim_config:/home/dev/.config  # MORAI 로그인/설정 유지 (down 해도 재로그인 불필요)
      - morai_sim_local:/home/dev/.local    # 런처 다운로드 데이터 유지

  dev:
    <<: *common
    container_name: morai-dev
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./catkin_ws:/home/dev/catkin_ws     # sim 과 동일 워크스페이스 (빌드는 한 곳에서만)
      - dev_config:/home/dev/.config        # dev 용 설정 유지 (sim 과 별도 볼륨 → 충돌 방지)
      - dev_local:/home/dev/.local

# 로그인/다운로드/설정을 담는 named volume (컨테이너를 지워도 데이터는 남음)
volumes:
  morai_sim_config:
  morai_sim_local:
  dev_config:
  dev_local:
